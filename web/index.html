<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic Dev Platform - Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; padding: 24px; }
  h1 { font-size: 1.5rem; margin-bottom: 8px; }
  .sub { color: #8b949e; margin-bottom: 24px; font-size: 0.9rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
  .card h2 { font-size: 1rem; margin-bottom: 12px; color: #58a6ff; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #21262d; }
  th { color: #8b949e; font-weight: 500; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; }
  .tag-running { background: #1f6feb33; color: #58a6ff; }
  .tag-completed { background: #23863633; color: #3fb950; }
  .tag-asset { background: #8957e533; color: #a371f7; }
  #status { margin-top: 16px; color: #8b949e; font-size: 0.8rem; }
</style>
</head>
<body>
<h1>Agentic Dev Platform</h1>
<p class="sub">Dual-graph autonomous dev loop &mdash; Asset Graph + Exploration Graph &mdash; Grok demo build</p>
<div class="grid">
  <div class="card">
    <h2>Assets (permanent graph)</h2>
    <table><thead><tr><th>ID</th><th>Type</th><th>Name</th><th>Parent</th></tr></thead><tbody id="assets"></tbody></table>
  </div>
  <div class="card">
    <h2>Tasks</h2>
    <table><thead><tr><th>ID</th><th>Status</th><th>Goal</th></tr></thead><tbody id="tasks"></tbody></table>
  </div>
  <div class="card">
    <h2>Explorations</h2>
    <table><thead><tr><th>ID</th><th>Task</th><th>Type</th><th>Content</th><th>Edge</th></tr></thead><tbody id="explorations"></tbody></table>
  </div>
</div>
<p id="status">Loading...</p>
<script>
function cell(value) {
  const td = document.createElement('td');
  td.textContent = value == null || value === '' ? '-' : String(value);
  return td;
}
function tagCell(value, kind) {
  const td = document.createElement('td');
  const span = document.createElement('span');
  span.className = 'tag tag-' + kind;
  span.textContent = value == null || value === '' ? '-' : String(value);
  td.appendChild(span);
  return td;
}
function addRow(tbody, cells) {
  const tr = document.createElement('tr');
  cells.forEach((item) => tr.appendChild(item));
  tbody.appendChild(tr);
}
fetch('data.json').then((response) => {
  if (!response.ok) throw new Error(String(response.status));
  return response.json();
}).then((data) => {
  const assets = data.assets || [];
  const tasks = data.tasks || [];
  const explorations = data.explorations || [];
  assets.forEach((row) => {
    addRow(document.getElementById('assets'), [
      cell(row.id), tagCell(row.type, 'asset'), cell(row.name), cell(row.parent_id),
    ]);
  });
  tasks.forEach((row) => {
    addRow(document.getElementById('tasks'), [
      cell(row.id), tagCell(row.status, row.status || 'running'), cell(row.goal),
    ]);
  });
  explorations.forEach((row) => {
    addRow(document.getElementById('explorations'), [
      cell(row.id), cell(row.task_id), cell(row.node_type), cell(row.content), cell(row.edge_type),
    ]);
  });
  document.getElementById('status').textContent =
    'Loaded ' + assets.length + ' assets, ' + tasks.length + ' tasks, ' + explorations.length + ' explorations.';
}).catch(() => {
  document.getElementById('status').textContent = 'Run the demo first: python3 -m src.main --demo';
});
</script>
</body>
</html>
